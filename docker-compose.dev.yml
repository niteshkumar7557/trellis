
#   docker compose -f docker-compose.dev.yml down
#   docker compose -f docker-compose.dev.yml up -d
#   docker exec -it trellis-dev-db psql -U trellis -d trellisdb

name: trellis-dev
services:
  db:
    image: postgres:18
    container_name: trellis-dev-db
    env_file:
      - ./backend/.env
    ports:
      - "5050:5432"
    volumes:
      - trellis_postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trellis -d trellisdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The topic graph. Browser UI: http://localhost:7474 (user neo4j, password below).
  neo4j:
    image: neo4j:5
    container_name: trellis-dev-neo4j
    environment:
      # Dev only, like the Postgres password in example.env. Keep it the same as
      # NEO4J_PASSWORD in backend/.env. Neo4j reads this on the FIRST start only: once the
      # volume exists, changing it here does nothing.
      NEO4J_AUTH: neo4j/trellis-dev-pass
    ports:
      - "7474:7474" # the Browser UI
      - "7687:7687" # bolt: the protocol the driver speaks
    volumes:
      - trellis_neo4j_dev_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p trellis-dev-pass 'RETURN 1' || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  trellis_postgres_dev_data:
  trellis_neo4j_dev_data:
